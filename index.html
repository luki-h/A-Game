<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="An endless single-player money clicker.">
<title>Money Press</title>
<link rel="stylesheet" href="style.css">
<script src="game.js" defer></script>
<script src="leaderboard.js" defer></script>
</head>
<body>
<header class="masthead"><span class="brand-mark" aria-hidden="true">$</span> Money Press <label class="mode-switch"><input id="v2-mode" type="checkbox" role="switch"> V2 features</label></header>
<main>
  <section class="press" aria-labelledby="balance-label">
    <p class="eyebrow" id="balance-label">Balance</p>
    <p class="balance" id="balance">$0</p>
    <div class="rates">
      <span><strong id="per-click">$1</strong> per click</span>
      <span><strong id="per-second">$0</strong> per second</span>
    </div>
    <div class="bill-area" id="bill-area">
      <button class="bill" id="bill" aria-label="Click the dollar bill to earn coins">
        <span class="bill-face" aria-hidden="true">
          <span class="corner top-left">1</span><span class="corner top-right">1</span>
          <span class="bill-title">MONEY PRESS</span><span class="seal">$</span>
          <span class="bill-title">ONE DOLLAR</span>
          <span class="corner bottom-left">1</span><span class="corner bottom-right">1</span>
        </span>
      </button>
      <span class="finger-icons" id="finger-icons" aria-hidden="true" hidden></span>
    </div>
    <div class="finger-display">
      <span id="finger-count"></span>
    </div>
    <p id="v2-message" role="status" hidden></p>
    <p class="hint">Click the bill to earn coins</p>
  </section>
  <section class="shop" aria-labelledby="shop-heading">
    <h1 id="shop-heading">Upgrades</h1>
    <form id="bank-form" class="bank-form">
      <label for="bank-name">Your bank’s name</label>
      <div class="name-controls"><input id="bank-name" maxlength="32" required><button>Save</button></div>
    </form>
    <section class="extras" id="command-panel" hidden>
      <h2>Command panel</h2>
      <button type="button" id="grant-coins">Add $10,000</button>
    </section>
    <section class="extras" id="online-panel" hidden>
      <h2>Leaderboard</h2>
      <p id="online-status" role="status">Connecting to the leaderboard…</p>
      <form id="account-form" hidden>
        <label>Username <input name="username" autocomplete="username" maxlength="32" required></label>
        <button>Join leaderboard</button>
      </form>
      <div id="account-actions" hidden>
        <button type="button" id="post-score">Post my bill clicks</button>
      </div>
      <ol id="scores"></ol>
    </section>
    <p id="notice" class="sr-only" role="status"></p>
    <ul id="upgrades" class="upgrades"></ul>
  </section>
</main>
<button class="gold-bar" id="gold-bar" type="button" hidden>Gold bar · Claim bonus</button>
</body>
</html>
